name: Experience feedback / 体验反馈
description: Report a real concept-to-ui run, including selection-gate and preservation failures.
title: "[Experience]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing concept-to-ui. Reproducible failures are especially useful.
        感谢体验 concept-to-ui，能够复现的失败案例尤其有帮助。
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome / 结果
      options:
        - Completed successfully / 成功完成
        - Blocked before concept selection / 选择方案前卡住
        - Blocked after concept selection / 选择方案后卡住
        - Completed with regressions / 完成但出现功能回退
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Screen and request / 页面与需求
      description: Describe the screen type and sanitized prompt. Do not include private URLs, credentials, or product data.
      placeholder: Dashboard redesign; local React app; prompt used…
    validations:
      required: true
  - type: dropdown
    id: concepts
    attributes:
      label: Were A/B/C materially different? / 三套方案是否有实质区别？
      options:
        - Yes / 是
        - Partly / 部分
        - No / 否
        - Concepts were not generated / 未生成方案
    validations:
      required: true
  - type: dropdown
    id: waited
    attributes:
      label: Did Codex wait for your choice before editing UI files? / Codex 是否等待选择后才修改 UI？
      options:
        - Yes / 是
        - No / 否
        - Unsure / 不确定
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact steps and failure point / 复现步骤与卡点
      placeholder: |
        1. …
        2. …
        Expected / 预期：
        Actual / 实际：
    validations:
      required: true
  - type: checkboxes
    id: preservation
    attributes:
      label: What survived implementation? / 哪些原有能力得到保留？
      options:
        - label: Routes / 路由
        - label: APIs and data / API 与数据
        - label: Authentication / 认证
        - label: Key interactions / 关键交互
        - label: Accessibility and keyboard use / 可访问性与键盘操作
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Codex client, operating system, framework, Python and Pillow versions when relevant.
      placeholder: ChatGPT Work; Windows 11; React; Python 3.12; Pillow 12.1
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏证据
      description: Logs, screenshots, comparison metrics, or a minimal public repository.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed credentials, private URLs, and confidential product data. / 我已移除凭据、内部链接和机密产品数据。
          required: true
